name: Ativar envio imediato de clientes
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ativar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ferramentas
        run: |
          pip install google-auth requests
      - name: Ativar somente o emissor Telegram
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          credentials="$RUNNER_TEMP/firebase-telegram.json"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          python - <<'PY'
          import json, os, base64
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          credentials = service_account.Credentials.from_service_account_info(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"]), scopes=["https://www.googleapis.com/auth/cloud-platform"])
          session = AuthorizedSession(credentials)
          for name in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"):
              value = os.environ[name].strip()
              if not value:
                  raise RuntimeError("Configuração ausente: " + name)
              payload = base64.b64encode(value.encode()).decode()
              response = session.post("https://secretmanager.googleapis.com/v1/projects/vivacred-5a5b8/secrets/" + name + ":addVersion", json={"payload": {"data": payload}}, timeout=30)
              if response.status_code != 200:
                  raise RuntimeError("Falha ao configurar " + name + ": HTTP " + str(response.status_code))
              print(name + ": versão configurada")
          PY
