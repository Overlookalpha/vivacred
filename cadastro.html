<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta - IsaCred</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
padding:30px 0;
}

.card{
background:#1e293b;
padding:40px;
border-radius:12px;
width:90%;
max-width:400px;
text-align:center;
}

h2{
margin-bottom:20px;
}

label{
display:block;
text-align:left;
font-size:12px;
color:#94a3b8;
margin-bottom:4px;
margin-top:12px;
}

input,select{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-size:14px;
}

.linha2{
display:flex;
gap:10px;
}

.linha2 > div{
flex:1;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#ff7a18;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
margin-top:22px;
}

button:hover{
background:#ff5500;
}

button:disabled{
opacity:0.6;
cursor:default;
}

.back{
margin-top:15px;
display:block;
color:#ccc;
font-size:12px;
text-decoration:none;
}

.aviso{
font-size:11px;
color:#94a3b8;
margin-top:6px;
text-align:left;
}

.erroCadastro{
display:none;
margin-top:14px;
padding:13px;
border:1px solid #fb7185;
border-radius:8px;
background:#4c1d2b;
color:#ffe4e6;
font-size:13px;
line-height:1.45;
text-align:left;
}

.erroCadastro.visivel{display:block;}
.erroCadastro a{color:#fff;font-weight:bold;}
</style>
</head>

<body>

<div class="card">
<h2>Criar conta no IsaCred</h2>

<label>Nome completo</label>
<input type="text" id="nome" placeholder="Seu nome completo">

<label>Email</label>
<input type="email" id="email" placeholder="Seu e-mail">

<label>Senha</label>
<input type="password" id="senha" placeholder="Crie uma senha">
<div class="aviso">Mínimo de 6 caracteres.</div>

<label>Confirmar senha</label>
<input type="password" id="confirmarSenha" placeholder="Repita a senha">

<label>Telefone</label>
<input type="tel" id="telefone" placeholder="Telefone com DDD/indicativo">

<div class="linha2">
<div>
<label>País</label>
<select id="pais">
<option value="BR">🇧🇷 Brasil</option>
<option value="PT">🇵🇹 Portugal</option>
</select>
</div>
<div>
<label>CPF / NIF</label>
<input type="text" id="documento" placeholder="CPF ou NIF">
</div>
</div>

<label>Chave Pix</label>
<input type="text" id="pix" placeholder="Sua chave Pix (opcional)">

<label>Profissão</label>
<input type="text" id="profissao" placeholder="Sua profissão (opcional)">

<div class="linha2">
<div>
<label>Cidade</label>
<input type="text" id="cidade" placeholder="Sua cidade (opcional)">
</div>
<div>
<label>Estado</label>
<input type="text" id="estado" placeholder="UF ou distrito (opcional)">
</div>
</div>

<label>Data de nascimento</label>
<input type="text" id="dataNascimento" placeholder="DD/MM/AAAA" maxlength="10">

<label>Código de indicação</label>
<input type="text" id="codigoIndicacao" placeholder="Código de quem te indicou (opcional)">
<div class="aviso">Se alguém te indicou, coloque o código dela aqui. Vocês dois ganham IsaCoins quando você quitar seu primeiro empréstimo.</div>

<button id="btnCadastrar">Criar conta</button>

<div id="erroCadastro" class="erroCadastro" role="alert"></div>

<a href="login.html" class="back">Já tem conta? Entrar</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
deleteUser,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-functions.js";
import {
getFirestore,
doc,
setDoc,
query,
where,
getDocs,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDJHtQp7OUxgYqtcD_2eTqzh1BRpufvKrY",
authDomain: "vivacred-5a5b8.firebaseapp.com",
projectId: "vivacred-5a5b8",
storageBucket: "vivacred-5a5b8.firebasestorage.app",
messagingSenderId: "932933359706",
appId: "1:932933359706:web:59fd16618feea3b2fa6063"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const functions = getFunctions(app, "europe-west1");
const criarPerfilUsuario = httpsCallable(functions, "criarPerfilUsuario");
await setPersistence(auth, browserLocalPersistence);

function formatarDataNascimento(valor){
const numeros = valor.replace(/\D/g, "").slice(0, 8);
let saida = numeros;
if (numeros.length > 4) {
saida = numeros.slice(0, 2) + "/" + numeros.slice(2, 4) + "/" + numeros.slice(4);
} else if (numeros.length > 2) {
saida = numeros.slice(0, 2) + "/" + numeros.slice(2);
}
return saida;
}

const inputDataNascimento = document.getElementById("dataNascimento");
inputDataNascimento.addEventListener("input", () => {
inputDataNascimento.value = formatarDataNascimento(inputDataNascimento.value);
});

function dataNascimentoValida(valor){
if (!/^\d{2}\/\d{2}\/\d{4}$/.test(valor)) return false;
const [dia, mes, ano] = valor.split("/").map(Number);
const data = new Date(ano, mes - 1, dia);
if (data.getFullYear() !== ano || data.getMonth() !== mes - 1 || data.getDate() !== dia) return false;
const hoje = new Date();
let idade = hoje.getFullYear() - ano;
if (hoje.getMonth() < mes - 1 || (hoje.getMonth() === mes - 1 && hoje.getDate() < dia)) idade--;
return idade >= 18 && idade <= 120;
}

function traduzErro(codigo){
const mensagens = {
"auth/email-already-in-use": "Esse e-mail já está cadastrado. Tente entrar em vez de criar conta.",
"auth/invalid-email": "Digite um e-mail válido.",
"auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
"auth/missing-password": "Digite uma senha.",
"auth/network-request-failed": "Falha de conexão. Verifique sua internet e tente de novo."
};
return mensagens[codigo] || "Não foi possível criar a conta (" + codigo + ").";
}

function mostrarErroCadastro(html){
 const area = document.getElementById("erroCadastro");
 area.innerHTML = html;
 area.classList.add("visivel");
}

function limparErroCadastro(){
 const area = document.getElementById("erroCadastro");
 area.textContent = "";
 area.classList.remove("visivel");
}

// Gera um código de indicação curto e único pra esse usuário poder
// compartilhar com parentes/amigos. Tenta algumas vezes até achar um
// código que ninguém mais esteja usando (chance de colisão é baixíssima,
// mas confere mesmo assim).
function letraBaseDoNome(nome){
 const semAcento = nome
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g, "")
 .toUpperCase()
 .replace(/[^A-Z]/g, "");
 return (semAcento.slice(0, 6) || "USER");
}

async function gerarCodigoIndicacao(nome){
 const base = letraBaseDoNome(nome);

 for(let tentativa = 0; tentativa < 5; tentativa++){
  const sufixo = String(Math.floor(100 + Math.random() * 900));
  const candidato = base + sufixo;

  const existenteSnap = await getDocs(
   query(collection(db, "usuarios"), where("codigoIndicacao", "==", candidato))
  );

  if(existenteSnap.empty){
   return candidato;
  }
 }

 // Extremamente improvável chegar aqui, mas garante que sempre volta algo.
 return base + Date.now().toString().slice(-4);
}

async function buscarIndicadorPorCodigo(codigo){
 const codigoNormalizado = codigo.trim().toUpperCase();
 if(!codigoNormalizado) return null;

 const snap = await getDocs(
  query(collection(db, "usuarios"), where("codigoIndicacao", "==", codigoNormalizado))
 );

 if(snap.empty) return null;

 return snap.docs[0].id;
}

// Trava pra evitar duplo clique/duplo envio enquanto o cadastro
// ainda está em andamento (mesma lógica usada no Viralizar pra
// evitar corrida entre o cadastro e o redirecionamento).
let cadastrando = false;

const btnCadastrar = document.getElementById("btnCadastrar");

btnCadastrar.addEventListener("click", async () => {
if (cadastrando) return;

const nome = document.getElementById("nome").value.trim();
const email = document.getElementById("email").value.trim();
const senha = document.getElementById("senha").value;
const confirmarSenha = document.getElementById("confirmarSenha").value;
const telefone = document.getElementById("telefone").value.trim();
const pais = document.getElementById("pais").value;
const documento = document.getElementById("documento").value.trim();
const dataNascimento = document.getElementById("dataNascimento").value.trim();
const pix = document.getElementById("pix").value.trim();
const profissao = document.getElementById("profissao").value.trim();
const cidade = document.getElementById("cidade").value.trim();
const estado = document.getElementById("estado").value.trim();
const codigoIndicacaoDigitado = document.getElementById("codigoIndicacao").value.trim();


if (!nome || !email || !senha || !telefone || !documento || !dataNascimento) {
alert("Preencha todos os campos antes de continuar.");
return;
}

const documentoNormalizado = documento.replace(/\D/g, "");
if ((pais === "BR" && documentoNormalizado.length !== 11) || (pais === "PT" && documentoNormalizado.length !== 9)) {
alert("Informe um CPF ou NIF válido.");
return;
}

if (senha.length < 6) {
alert("A senha precisa ter pelo menos 6 caracteres.");
return;
}

if (senha !== confirmarSenha) {
alert("As senhas não são iguais.");
return;
}

if (!dataNascimentoValida(dataNascimento)) {
alert("Digite a data de nascimento no formato DD/MM/AAAA.");
return;
}

cadastrando = true;
btnCadastrar.disabled = true;
btnCadastrar.textContent = "Criando conta...";
limparErroCadastro();
let contaCriadaAgora = null;

try {
const cred = await createUserWithEmailAndPassword(auth, email, senha);
contaCriadaAgora = cred.user;

await criarPerfilUsuario({
 nome, email, telefone, cpf: documentoNormalizado, pais, dataNascimento, pix, profissao,
 cidade, estado, codigoIndicacao: codigoIndicacaoDigitado
});

// O alerta de nova conta para o Telegram é criado pelo servidor dentro de
// criarPerfilUsuario (o cliente não tem permissão de escrita em notificacoes).

window.location.href = "home.html";
} catch (error) {
if (error.code === "functions/already-exists") {
 // O perfil recusou o CPF/NIF porque pertence a outra conta. Como esse
 // usuário de autenticação acabou de ser criado e não ganhou perfil, ele
 // não deve ficar órfão impedindo uma tentativa futura com o mesmo e-mail.
 if (contaCriadaAgora) {
  try { await deleteUser(contaCriadaAgora); }
  catch (erroLimpeza) { console.warn("Não foi possível limpar a conta incompleta:", erroLimpeza); }
 }
 const emailLogin = encodeURIComponent(email);
 mostrarErroCadastro(
  "<strong>Este CPF/NIF já está cadastrado.</strong><br>" +
  "Se a conta for sua, entre ou recupere a senha. Se não reconhecer o cadastro, fale com o atendimento.<br><br>" +
  '<a href="login.html?email=' + emailLogin + '">Entrar na conta</a> · ' +
  '<a href="login.html?email=' + emailLogin + '#recuperar">Recuperar senha</a>'
 );
} else {
 mostrarErroCadastro(traduzErro(error.code));
}
cadastrando = false;
btnCadastrar.disabled = false;
btnCadastrar.textContent = "Criar conta";
}
});
</script>
<script>
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
