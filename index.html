<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsaCred</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial, sans-serif;
  color:white;
  text-align:center;
  background-image:url("https://images.unsplash.com/photo-1605902711622-cfb43c4437b5");
  background-size:cover;
  background-position:center;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  z-index:1;
  pointer-events:none;
}

.video-fundo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
  opacity:0;
}
.video-fundo.pronto{opacity:1;}
.controle-fundo{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:3;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.5);
  border-radius:8px;
  background:rgba(0,0,0,.5);
  color:white;
  font:inherit;
  font-size:12px;
  cursor:pointer;
}

.container{
  position:relative;
  z-index:2;
}

h1{
  font-size:3rem;
  letter-spacing:2px;
}

.tag{
  margin-top:15px;
  font-size:1rem;
  opacity:0.8;
}
  .btn{
  display:inline-block;
  padding:12px 28px;
  background:#ff7a18;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  background:#ff5500;
}
</style>
</head>

<body>

<video id="videoFundo" class="video-fundo" autoplay muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
<button id="controleFundo" class="controle-fundo" type="button" hidden>Pausar fundo</button>

<div class="container">
  <h1>IsaCred 🔥</h1>
  <div class="tag">Crédito inteligente começa aqui</div>

  <br><br>

  <a href="login.html" class="btn">Entrar</a>
  <br><br>
<a href="cadastro.html" class="btn">Criar conta</a>
  <br><br>
<button id="btnInstalar" class="btn" style="display:none;">📲 Instalar App</button>
</div>

<script>
const videoFundo = document.getElementById("videoFundo");
const controleFundo = document.getElementById("controleFundo");
const reduzirMovimento = window.matchMedia("(prefers-reduced-motion: reduce)");

function configurarVideoFundo(){
  if(reduzirMovimento.matches || navigator.connection?.saveData){
    videoFundo.pause();
    videoFundo.removeAttribute("src");
    videoFundo.load();
    videoFundo.classList.remove("pronto");
    controleFundo.hidden = true;
    return;
  }
  videoFundo.muted = true;
  if(!videoFundo.getAttribute("src")) videoFundo.src = "assets/entrada-celular-cartao.mp4";
  // Reprodução bloqueada ou indisponível: a foto permanece como fundo.
  videoFundo.play().catch(() => {});
}
videoFundo.addEventListener("playing", () => {
  videoFundo.classList.add("pronto");
  controleFundo.hidden = false;
  controleFundo.textContent = "Pausar fundo";
});
videoFundo.addEventListener("error", () => {
  videoFundo.classList.remove("pronto");
  controleFundo.hidden = true;
});
controleFundo.addEventListener("click", () => {
  if(videoFundo.paused){
    videoFundo.play().catch(() => {});
  }else{
    videoFundo.pause();
    controleFundo.textContent = "Reproduzir fundo";
  }
});
reduzirMovimento.addEventListener("change", configurarVideoFundo);
configurarVideoFundo();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

let deferredPrompt;
const btnInstalar = document.getElementById("btnInstalar");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  btnInstalar.style.display = "inline-block";
});

btnInstalar.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
});
</script>

</body>
</html>
