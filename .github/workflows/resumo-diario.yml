name: Resumo diario VivaCred (Telegram)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      previa:
        description: "Enviar prévia ao administrador sem processar bônus"
        type: boolean
        default: true

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r .github/scripts/requirements.txt

      - name: Enviar resumo diario
        env:
          PREVIA_TELEGRAM: ${{ github.event.inputs.previa || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/resumo_diario.py
